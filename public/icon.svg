<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <circle cx="256" cy="240" r="160" fill="url(#glow)" />
  
  <!-- Subtle Hour Markings / Ring -->
  <circle cx="256" cy="240" r="150" fill="none" stroke="#ca8a04" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 8" />
  <circle cx="256" cy="90" r="4" fill="#ca8a04" />
  <circle cx="406" cy="240" r="4" fill="#ca8a04" />
  <circle cx="256" cy="390" r="4" fill="#ca8a04" />
  <circle cx="106" cy="240" r="4" fill="#ca8a04" />

  <!-- Open Scriptures / Bible Path -->
  <g transform="translate(136, 160)" stroke="url(#gold)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Page -->
    <path d="M 120 160 C 80 145, 30 148, 0 165 L 0 35 C 30 18, 80 15, 120 30 Z" fill="#292524" fill-opacity="0.7"/>
    <!-- Right Page -->
    <path d="M 120 160 C 160 145, 210 148, 240 165 L 240 35 C 210 18, 160 15, 120 30 Z" fill="#292524" fill-opacity="0.7"/>
    <!-- Center Spine -->
    <line x1="120" y1="30" x2="120" y2="160" />
    <!-- Verse Lines Left -->
    <line x1="30" y1="65" x2="90" y2="60" stroke="#fef08a" stroke-opacity="0.6" stroke-width="6" />
    <line x1="30" y1="95" x2="90" y2="90" stroke="#fef08a" stroke-opacity="0.6" stroke-width="6" />
    <line x1="30" y1="125" x2="80" y2="120" stroke="#fef08a" stroke-opacity="0.6" stroke-width="6" />
    <!-- Verse Lines Right -->
    <line x1="150" y1="60" x2="210" y2="65" stroke="#fef08a" stroke-opacity="0.6" stroke-width="6" />
    <line x1="150" y1="90" x2="210" y2="95" stroke="#fef08a" stroke-opacity="0.6" stroke-width="6" />
    <line x1="150" y1="120" x2="200" y2="125" stroke="#fef08a" stroke-opacity="0.6" stroke-width="6" />
  </g>

  <!-- Rays of Light -->
  <g stroke="url(#gold)" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="130" x2="256" y2="105" />
    <line x1="220" y1="140" x2="200" y2="120" />
    <line x1="292" y1="140" x2="312" y2="120" />
  </g>
</svg>
